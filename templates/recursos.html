{% extends "base.html" %}

{% block title %}Recursos{% endblock %}

{% block content %}
<section class="p-3 mb-4 bg-white rounded">
  <h2>Recursos para Estudiantes</h2>
  <div class="row">
    {% for r in recursos %}
    <div class="col-md-6 mb-3">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ r.nombre }}</h5>
          <p class="card-text">{{ r.tipo }}</p>
          {% if r.gratuito %}
            <span class="badge bg-success">Gratuito</span>
          {% else %}
            <span class="badge bg-warning text-dark">De pago</span>
          {% endif %}
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
